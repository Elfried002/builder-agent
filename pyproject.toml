[project]
name = "codidev"
version = "0.1.0"
description = "CodiDev — core agentique : contrats, preuves, audit, sécurité (Phase 0 — Foundation)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "CodiDev" }]
dependencies = [
    "jsonschema==4.26.0",
    "rfc3339-validator==0.1.4",
]

[project.scripts]
codidev = "codidev.cli:main"

[dependency-groups]
dev = [
    "bandit==1.9.1",
    "pip-audit==2.9.0",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.15.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codidev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "C4", "RUF"]
ignore = ["S101"]  # assert autorisé : utilisé par les tests et les invariants de contrat

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]  # valeurs factices de test explicitement inoffensives
# `statuses.py` est le vocabulaire canonique : GateOutcome.PASS est un verdict, pas un mot de passe.
"src/codidev/statuses.py" = ["S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
